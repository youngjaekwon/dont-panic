name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make proto
      - name: gen is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "gen/ is out of date with proto/: run make proto and commit the result"
            exit 1
          fi
      - name: breaking against latest release
        run: |
          tag=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "no release tag on main yet: breaking check skipped"
            exit 0
          fi
          make breaking AGAINST=".git#tag=$tag"

  coupon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/coupon
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: coupon
          POSTGRES_PASSWORD: coupon
          POSTGRES_DB: coupon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coupon"
          --health-interval 1s
          --health-retries 30
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://coupon:coupon@localhost:5432/coupon
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: services/coupon
      - run: uv sync --frozen
      - run: uvx ruff@0.17.3 format --check --exclude migrations/versions .
      - run: uv run lint-imports
      - run: uv run pytest

  coupon-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f services/coupon/Dockerfile .
